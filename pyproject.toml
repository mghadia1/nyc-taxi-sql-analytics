[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-sql-analytics"
version = "0.1.0"
description = "SQL analytics over 9.5M NYC yellow-taxi trips: data-quality audit, demand, speed, and how tip buttons shape tipping"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=2.0",
  "pyarrow>=16",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
nyctaxi = "nyctaxi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nyctaxi = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
